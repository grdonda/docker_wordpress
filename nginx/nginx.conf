 server {
    listen 80;
    server_name localhost
                wordpressteste.com.br
                www.wordpressteste.com.br;

    return 302 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost
                wordpressteste.com.br
                www.wordpressteste.com.br;

    ssl_certificate     /opt/bitnami/nginx/conf/bitnami/certs/nginx.crt;
    ssl_certificate_key /opt/bitnami/nginx/conf/bitnami/certs/nginx.key;

    error_log  /app/error.log;
    access_log /app/access.log;

    proxy_redirect off;
    location / {
#
        add_header          X-Served-By $host;

        proxy_set_header    Host $host;
        proxy_set_header    X-Forwarded-Scheme $scheme;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Forwarded-For $remote_addr;
        proxy_set_header    X-Real-IP $remote_addr;
        #proxy_pass $forward_scheme://$server:$port;

        proxy_pass http://wordpress:8080;  # ALTERADO
    }
}
